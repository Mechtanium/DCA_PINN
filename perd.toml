# PERD's build and Store settings for this workflow.
# Guide: https://perd.app/docs/workflows/publishing/#compute-class-perdtoml

[compute]
# The machine the workflow runs on: small, medium, large or gpu_t4.
# small is 2 vCPU and 8 GiB. The model is a small Transformer on CPU-only
# torch (requirements.txt), so a GPU would sit idle. At the page's defaults
# (4 wells, 50 steps) an epoch takes about 0.013 s and the worker about
# 0.3 GB; the page's largest settings (8 wells, 500 steps, 4 layers, 8
# heads) take about 2.8 s per epoch and 2.9 GB.
class = "small"

[workflow]
summary = "Decline-curve analysis with a physics-informed Transformer: it fits the rates of a few wells and identifies their generating model among five classical decline models."
tags = ["decline-curve", "pinn", "production", "reservoir", "transformer"]
category = "Reservoir"
license = "MIT"
homepage = "https://github.com/Mechtanium/DCA_PINN"
